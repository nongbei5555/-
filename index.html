<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางเวลางาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-block">
      <h1>ตารางลงเวลางาน</h1>
      <p>จิ้มเวลาข้างล่างมาแตะที่ปฏิทินเลย</p>
    </div>
    <div class="nav">
      <button id="prevMonth" aria-label="เดือนก่อนหน้า">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="nextMonth" aria-label="เดือนถัดไป">›</button>
      <button class="today-btn" id="gotoToday">วันนี้</button>
      <button class="today-btn" id="btnSettings">แก้ไข</button>
    </div>
  </header>

  <!-- เพิ่ม: แท็บสลับหน้า -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="calendar">ปฏิทิน</button>
    <button class="tab" data-view="summary">สรุป</button>
  </nav>

  <!-- หน้าปฏิทิน (ของเดิม) -->
  <div id="viewCalendar">
    <div class="cal-card">
      <div class="weekday-row">
        <span class="sun">อา</span><span>จ</span><span>อ</span><span>พ</span><span>พฤ</span><span>ศ</span><span class="sat">ส</span>
      </div>
      <div class="board" id="board"></div>
    </div>

    <p class="legend-hint">จิ้มไปวางข้างบนได้เลย</p>
    <div class="legend" id="legend"></div>
    <button class="btn-add-event" id="btnAddEvent">+ เพิ่มนัดหมาย</button>
  </div>

  <!-- หน้าสรุป (ย้ายมาจากใต้ปฏิทิน) -->
  <div id="viewSummary" hidden>
    <section class="summary-card">
      <div class="summary-heading">
        <h2>สรุปชั่วโมงงานและรายได้</h2>
        <div class="summary-pick">
          <select id="summaryMonthSel" aria-label="เดือน"></select>
          <select id="summaryYearSel" aria-label="ปี"></select>
        </div>
      </div>
      <p id="summaryMonth" class="summary-month"></p>

      <div class="summary-stats">
        <div class="summary-stat">
          <span>ชั่วโมงทำงานรวม</span>
          <strong id="summaryHours">0 ชั่วโมง</strong>
        </div>
        <div class="summary-stat">
          <span>รายได้รวม</span>
          <strong id="summaryIncome">0 บาท</strong>
        </div>
      </div>

      <div class="income-breakdown">
        <h3>รายได้แยกตามประเภทเวร</h3>
        <div id="summaryBreakdown">
          <p class="empty-summary">ยังไม่มีข้อมูลรายได้ในเดือนนี้</p>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- รายละเอียดเวรและรายได้ -->
<div class="overlay" id="overlay">
  <div class="modal shift-modal">
    <h2>รายละเอียดเวร</h2>
    <p class="modal-date" id="modalDate"></p>

    <div id="shiftDetails" class="shift-details"></div>

    <label class="field-row" id="caseCountField">
      จำนวนเคส
      <input id="shiftCaseCount" type="number" min="1" step="1" value="1">
    </label>

    <label class="field-row">
      รายได้จริง (บาท)
      <input
        id="shiftIncomeOverride"
        type="number"
        min="0"
        step="0.01"
        placeholder="เว้นว่างเพื่อคำนวณตามอัตรา"
      >
      <small>กรอกยอดจริงเพื่อแทนยอดคำนวณ หรือว่างไว้เพื่อใช้อัตราที่ตั้งค่า</small>
    </label>

    <!-- เพิ่ม: การแจ้งเตือนของเวร -->
    <label class="check-row"><input type="checkbox" id="shiftNotify"> แจ้งเตือนก่อนเข้าเวร</label>
    <label class="field-row">
      แจ้งล่วงหน้า
      <select id="shiftLead"></select>
    </label>

    <p id="shiftPayPreview" class="shift-pay-preview"></p>

    <div class="modal-actions shift-modal-actions">
      <button class="btn-cancel" id="btnCancel">ปิด</button>
      <button class="btn-save-shift" id="btnSaveShift">บันทึก</button>
      <button class="btn-delete-solid" id="btnDelete">ลบเวร</button>
    </div>
  </div>
</div>

<!-- ตั้งค่า: เพิ่ม/ลบ/แก้ไขปุ่มเวร และตั้งอัตราค่าตอบแทน -->
<div class="overlay" id="settingsOverlay">
  <div class="modal settings-modal">
    <h2>ตั้งค่าปุ่มเวร</h2>
    <p class="modal-date">เลือกเวลาและเลือกสีได้เต็มที่เลย จัดไปสวยๆ</p>
    <div class="settings-list" id="settingsList"></div>
    <button class="btn-add-type" id="btnAddType">+ เพิ่มปุ่มเวร</button>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnCloseSettings">เสร็จแล้ว</button>
    </div>
  </div>
</div>

<!-- เพิ่ม: นัดหมาย -->
<!-- หน้าต่างเพิ่มและแก้ไขนัดหมาย -->
<div class="overlay" id="eventOverlay">
  <div class="modal shift-modal">

    <h2 id="evHeading">เพิ่มนัดหมาย</h2>

    <label class="field-row">
      ชื่อกิจกรรม
      <input id="evTitle" type="text" maxlength="60"
             placeholder="เช่น นัดแพทย์">
    </label>

    <!-- วันที่: วัน / เดือน / ปี พ.ศ. -->
    <label class="field-row">
      วันที่
      <input id="evDate" type="hidden">
      <div class="date-fields">
        <select id="evDateDay" aria-label="วัน"></select>
        <select id="evDateMonth" aria-label="เดือน"></select>
        <select id="evDateYear" aria-label="ปี พ.ศ."></select>
      </div>
    </label>

    <!-- วันที่สิ้นสุด: ไม่จำเป็นต้องกรอก -->
    <label class="field-row" id="evEndDateRow">
      ถึงวันที่ (ไม่ใส่ก็ได้)
      <input id="evEndDate" type="hidden">
      <div class="date-fields">
        <select id="evEndDateDay" aria-label="วันสิ้นสุด"></select>
        <select id="evEndDateMonth" aria-label="เดือนสิ้นสุด"></select>
        <select id="evEndDateYear" aria-label="ปีสิ้นสุด พ.ศ."></select>
      </div>
    </label>

    <!-- เวลาเริ่มต้น-->
    <label for="evStart">เวลาเริ่มต้น</label>
    <input
      type="time"
      id="evStart"
      lang="th-TH"
      value="09:00"
      step="60"
      required
    >

    <!-- เวลาสิ้นสุด-->
    <label for="evEnd">เวลาสิ้นสุด</label>
    <input
      type="time"
      id="evEnd"
      lang="th-TH"
      value="10:00"
      step="60"
      required
    >

    <label class="field-row">
      สี
      <input id="evColor" type="color" value="#6b7a8f">
    </label>

    <label class="check-row">
      <input type="checkbox" id="evNotify">
      เปิดการแจ้งเตือน
    </label>

    <label class="field-row">
      แจ้งล่วงหน้า
      <select id="evLead"></select>
    </label>

    <p id="evError" class="ev-error"></p>

    <div class="modal-actions shift-modal-actions">
      <button class="btn-cancel" id="evCancel">ปิด</button>
      <button class="btn-save-shift" id="evSave">บันทึก</button>
      <button class="btn-delete-solid" id="evDelete">ลบ</button>
      <button class="btn-delete-solid" id="evDeleteAll">ลบทั้งช่วง</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
